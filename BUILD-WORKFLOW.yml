name: Build desktop apps
# Builds the Windows, macOS and Linux installers, each on its own operating system.
# Run it: Actions tab, "Build desktop apps", Run workflow. Download the files from the finished run.
# To publish permanent download links: create a Release with a tag such as v1.0.0 and the files are attached to it.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # unsigned builds
      - uses: actions/upload-artifact@v4
        with:
          name: photo-mirror-${{ matrix.os }}
          path: |
            dist-desktop/*.exe
            dist-desktop/*.dmg
            dist-desktop/*.zip
            dist-desktop/*.AppImage
            dist-desktop/*.deb
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist-desktop/*.exe
            dist-desktop/*.dmg
            dist-desktop/*.zip
            dist-desktop/*.AppImage
            dist-desktop/*.deb
